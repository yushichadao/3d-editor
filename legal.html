  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg-deep);color:var(--text);

  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .legal-top{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,color-mix(in srgb,var(--bg-deep) 92%,transparent),color-mix(in srgb,var(--bg-deep) 55%,transparent));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.5px;}
  .brand .logo{width:24px;height:24px;border-radius:6px;
    background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent-3),var(--accent));}
  .legal-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .legal-back{font-size:13px;color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:8px;white-space:nowrap;}
  .legal-back:hover{border-color:var(--accent);text-decoration:none;color:var(--accent);}
  .legal-lang{display:flex;gap:4px;}
  .legal-lang-btn{font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);cursor:pointer;transition:all .15s;}
  .legal-lang-btn:hover{color:var(--text);border-color:var(--accent);}
  .legal-lang-btn.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);}
  .legal-nav{display:flex;gap:8px;justify-content:center;padding:18px 20px 6px;flex-wrap:wrap;}
  .legal-tab{font-size:13px;padding:8px 18px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg-panel);color:var(--text);cursor:pointer;transition:all .18s;font-weight:600;}
  .legal-tab:hover{border-color:var(--accent);color:var(--accent);}
  .legal-tab.active{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0c0e16;}
  .legal-main{max-width:760px;margin:0 auto;padding:8px 20px 40px;}
  .legal-main h1{font-size:22px;text-align:center;margin:14px 0 22px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .legal-body h2{font-size:15px;margin:22px 0 8px;color:var(--text);padding-left:11px;position:relative;}
  .legal-body h2::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2));}
  .legal-body p{font-size:13.5px;color:var(--text-dim);margin:0 0 6px;}
  .legal-foot{max-width:760px;margin:0 auto;padding:22px 20px 48px;border-top:1px solid var(--border);text-align:center;}
  .legal-ai{font-size:12px;color:var(--text-dim);margin:0 0 10px;}
  .legal-repo{display:inline-block;font-size:13px;margin-bottom:10px;}
  .legal-copy{font-size:12px;color:var(--text-dim);margin:0;}
  @media(max-width:560px){.legal-top{flex-direction:column;align-items:flex-start;}.legal-actions{width:100%;justify-content:space-between;}}

  function getParam(name, def){ const p = new URLSearchParams(location.search); const v = p.get(name); return v || def; }
  function currentType(){ const t = getParam('type','terms'); return TYPES.includes(t) ? t : 'terms'; }
  function currentLang(){ const l = getParam('lang','zh'); return DATA[l] ? l : 'zh'; }
  function go(param, value){ const u = new URL(location.href); u.searchParams.set(param, value); location.href = u.toString(); }

  function render(){
    const lang = currentLang(), type = currentType(), d = DATA[lang];
    document.documentElement.lang = (lang === 'zh-tw') ? 'zh-tw' : lang;
    document.title = d.types[type].label;

    // 顶部返回文字
    document.querySelector('.legal-back').textContent = d.back;

    // 语言切换
    const langBox = document.getElementById('legal-lang');
    langBox.innerHTML = '';
    LANGS.forEach(L => {
      const b = document.createElement('button');
      b.className = 'legal-lang-btn' + (L.key === lang ? ' active' : '');
      b.textContent = L.label;
      b.onclick = () => go('lang', L.key);
      langBox.appendChild(b);
    });

    // 类型导航
    const nav = document.getElementById('legal-nav');
    nav.innerHTML = '';
    TYPES.forEach(tp => {
      const a = document.createElement('button');
      a.className = 'legal-tab' + (tp === type ? ' active' : '');
      a.textContent = d.types[tp].label;
      a.onclick = () => go('type', tp);
      nav.appendChild(a);
    });

    // 标题与正文
    document.getElementById('legal-title').textContent = d.types[type].label;
    const body = document.getElementById('legal-body');
    body.innerHTML = '';
    d.types[type].sections.forEach(s => {
      const h = document.createElement('h2'); h.textContent = s.h;
      const p = document.createElement('p'); p.textContent = s.p;
      body.appendChild(h); body.appendChild(p);
    });

    // 页脚
    document.getElementById('legal-ai').textContent = d.ai;
    const repo = document.getElementById('legal-repo');
    repo.textContent = d.repo;
    document.getElementById('legal-copy').textContent = d.copyright;
  }
  render();
